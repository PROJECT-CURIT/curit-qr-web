name: Deploy QR web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PRESENTATION_MODE: "false"
          VITE_BASE_PATH: /curit-qr-web
      - name: Apply field-sale settings
        if: ${{ vars.FIELD_SALE_CONFIG != '' }}
        env:
          FIELD_SALE_CONFIG: ${{ vars.FIELD_SALE_CONFIG }}
        run: node -e "const fs = require('node:fs'); const configPath = 'dist/field-sale/config.json'; const defaults = JSON.parse(fs.readFileSync(configPath, 'utf8')); const settings = JSON.parse(process.env.FIELD_SALE_CONFIG); const config = { ...defaults, ...settings, products:{ ...defaults.products, ...settings.products } }; fs.writeFileSync(configPath, JSON.stringify(config)); const catalogPath = 'dist/field-sale/catalog.json'; const catalog = JSON.parse(fs.readFileSync(catalogPath, 'utf8')); for (const [id, item] of Object.entries(catalog.products)) { const sale = config.products[id]; if (!sale || !Number.isSafeInteger(sale.price) || sale.price < 1) throw new Error('Missing published price for ' + id); item.price = sale.price; item.quantity = sale.quantity ?? null; item.status = sale.quantity === 0 ? 'SOLD_OUT' : config.bank && sale.quantity !== null ? 'ACTIVE' : 'PAUSED'; } fs.writeFileSync(catalogPath, JSON.stringify(catalog, null, 2) + '\n');"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
